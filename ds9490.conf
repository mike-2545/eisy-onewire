# eisy-onewire native USB control-device permission rule.
# UDX replaces both placeholders when the plugin is installed.
notify 100 {
        match "system" "USB";
        match "subsystem" "DEVICE";
        match "type" "ATTACH";
        match "vendor" "0x04fa";
        match "product" "0x2490";
        action "chown UDX_OWNER_PLACE_HOLDER /dev/$cdev && chmod UDX_PERMISSION_PLACE_HOLDER /dev/$cdev";
};
